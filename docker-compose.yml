version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: mongodb_container
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  web:
    build: .
    container_name: dash_dashboard
    restart: always
    ports:
      - "8050:8050"
    environment:
      - MONGO_URI=mongodb://db:27017/
    depends_on:
      - db
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
